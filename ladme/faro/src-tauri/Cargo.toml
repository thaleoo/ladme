[package]
name = "ladme-faro"
version = "0.7.4"
description = "Faro: agente de los computadores de la sala LADME"
authors = ["Laboratorio de Datos y Modelamiento Estadístico, UNAL Sede La Paz"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "faro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
hex = "0.4"
os_info = { version = "3", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
dirs = "5"
if-addrs = "0.13"
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions", "color"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Win32_System_Console"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
