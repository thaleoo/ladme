<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Reservas y gestión de equipos del Laboratorio de Aprendizaje de Datos y Modelado Estadístico (UNAL)." />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>LADME — Reservas y equipos</title>
    <script>
      // Aplica el tema elegido antes de pintar, para que no destelle el tema equivocado.
      try {
        var t = localStorage.getItem('ladme-tema')
        if (t === 'claro' || t === 'oscuro') document.documentElement.setAttribute('data-tema', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
