name: Faro

# Pruebas en cada cambio de ladme/faro. Instaladores para Windows y Linux:
#   - a mano: Actions → Faro → Run workflow (quedan como artefactos descargables), o
#   - con una etiqueta faro-vX.Y.Z (además se publican en Releases).
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   FARO_SUPABASE_URL, FARO_SUPABASE_KEY (la clave pública/anon, la misma de la PWA), FARO_PWA_URL.
on:
  push:
    branches: [main]
    tags: ["faro-v*"]
    paths:
      - "ladme/faro/**"
      - ".github/workflows/faro.yml"
  pull_request:
    paths:
      - "ladme/faro/**"
      - ".github/workflows/faro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ladme/faro/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ladme/faro/src-tauri
      - run: cargo test --locked

  instaladores:
    needs: pruebas
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/faro-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            paquetes: nsis
          - os: ubuntu-22.04
            paquetes: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      FARO_SUPABASE_URL: ${{ vars.FARO_SUPABASE_URL }}
      FARO_SUPABASE_KEY: ${{ vars.FARO_SUPABASE_KEY }}
      FARO_PWA_URL: ${{ vars.FARO_PWA_URL }}
    defaults:
      run:
        working-directory: ladme/faro
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ladme/faro/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ladme/faro/src-tauri
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.paquetes }}
      - uses: actions/upload-artifact@v4
        with:
          name: faro-${{ runner.os }}
          path: |
            ladme/faro/src-tauri/target/release/bundle/nsis/*.exe
            ladme/faro/src-tauri/target/release/bundle/deb/*.deb
            ladme/faro/src-tauri/target/release/bundle/appimage/*.AppImage
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/faro-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ladme/faro/src-tauri/target/release/bundle/nsis/*.exe
            ladme/faro/src-tauri/target/release/bundle/deb/*.deb
            ladme/faro/src-tauri/target/release/bundle/appimage/*.AppImage
