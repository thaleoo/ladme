name: Faro

# Pruebas en cada cambio de ladme/faro. Instaladores para Windows (.exe) y Linux (.deb, .rpm, .AppImage):
#   - a mano: Actions → Faro → Run workflow (quedan como artefactos descargables), o
#   - con una etiqueta faro-vX.Y.Z igual a la versión de tauri.conf.json: además se publican en
#     Releases con latest.json, y los Faro instalados se actualizan solos.
#   - canal de pruebas: una etiqueta faro-pruebas-vX.Y.Z publica en la release fija «faro-pruebas»
#     (prelanzamiento). Solo la reciben los equipos marcados «pruebas» en Administración → Faro.
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   FARO_SUPABASE_URL, FARO_SUPABASE_KEY (la clave pública/anon, la misma de la PWA), FARO_PWA_URL,
#   FARO_UPDATER_PUBKEY (clave pública de firma, ver ladme/faro/README.md).
# Secretos (pestaña Secrets): TAURI_SIGNING_PRIVATE_KEY y TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    branches: [main]
    tags: ["faro-v*", "faro-pruebas-v*"]
    paths:
      - "ladme/faro/**"
      - ".github/workflows/faro.yml"
  pull_request:
    paths:
      - "ladme/faro/**"
      - ".github/workflows/faro.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ladme/faro/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ladme/faro/src-tauri
      - run: cargo test --locked

  instaladores:
    needs: pruebas
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/faro-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            paquetes: nsis
          - os: ubuntu-22.04
            paquetes: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    env:
      FARO_SUPABASE_URL: ${{ vars.FARO_SUPABASE_URL }}
      FARO_SUPABASE_KEY: ${{ vars.FARO_SUPABASE_KEY }}
      FARO_PWA_URL: ${{ vars.FARO_PWA_URL }}
      FARO_UPDATER_PUBKEY: ${{ vars.FARO_UPDATER_PUBKEY }}
      FARO_UPDATER_URL: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
        working-directory: ladme/faro
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ladme/faro/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ladme/faro/src-tauri
      - run: npm ci
      - name: Compilar
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$FARO_UPDATER_PUBKEY" ]; then
              echo "::error::Falta la variable FARO_UPDATER_PUBKEY (contenido de faro.key.pub)."; exit 1
            fi
            # Con firma, Tauri exige la sección plugins.updater; se arma aquí con la clave pública.
            node -e 'require("fs").writeFileSync("actualizador.conf.json", JSON.stringify({
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey: process.env.FARO_UPDATER_PUBKEY.trim(), endpoints: [process.env.FARO_UPDATER_URL] } }
            }))'
            npx tauri build --bundles ${{ matrix.paquetes }} --config actualizador.conf.json
          else
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: los instaladores no traen firma y Faro no se actualizará solo."
            npx tauri build --bundles ${{ matrix.paquetes }}
          fi
      - name: Nombres sin espacios
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          b=src-tauri/target/release/bundle
          mkdir -p salida
          copiar() { for f in $1; do if [ -f "$f" ]; then cp "$f" "salida/$2"; if [ -f "$f.sig" ]; then cp "$f.sig" "salida/$2.sig"; fi; fi; done; return 0; }
          copiar "$b/nsis/*.exe" "faro-$v-windows-x64-setup.exe"
          copiar "$b/appimage/*.AppImage" "faro-$v-linux-x86_64.AppImage"
          copiar "$b/deb/*.deb" "faro-$v-linux-amd64.deb"
          copiar "$b/rpm/*.rpm" "faro-$v-linux-x86_64.rpm"
          cp instalar/* salida/
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: faro-${{ runner.os }}
          path: ladme/faro/salida/*

  publicar:
    needs: instaladores
    if: startsWith(github.ref, 'refs/tags/faro-')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: salida
          merge-multiple: true
      - name: Versión de la etiqueta
        id: version
        run: |
          v=$(node -p "require('./ladme/faro/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" = "faro-v$v" ]; then
            echo "release=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "faro-pruebas-v$v" ]; then
            echo "release=faro-pruebas" >> "$GITHUB_OUTPUT"
            echo "pruebas=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::La etiqueta ${GITHUB_REF_NAME} no coincide con la versión $v de tauri.conf.json"; exit 1
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - name: latest.json
        run: node ladme/faro/scripts/latest-json.mjs salida "${{ steps.version.outputs.v }}" "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.version.outputs.release }}"
      - name: Publicar versión estable
        if: steps.version.outputs.pruebas != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Faro ${{ steps.version.outputs.v }}
          make_latest: true
          files: salida/*
      - name: Publicar en el canal de pruebas
        if: steps.version.outputs.pruebas == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: faro-pruebas
          name: Faro · canal de pruebas
          body: "Última versión de prueba: ${{ steps.version.outputs.v }} (${{ github.ref_name }}). Solo la instalan los equipos en el canal «pruebas»."
          prerelease: true
          make_latest: false
          files: salida/*
