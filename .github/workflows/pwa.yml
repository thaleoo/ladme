name: PWA

on:
  push:
    paths:
      - "ladme/pwa/**"
      - "ladme/db/**"
      - ".github/workflows/pwa.yml"
  pull_request:
    paths:
      - "ladme/pwa/**"
      - "ladme/db/**"
      - ".github/workflows/pwa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ladme/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ladme/pwa/package-lock.json
      - run: npm ci
      - run: npm run build

  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Reglas de negocio (esquema + migraciones)
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash ladme/db/tests/ejecutar.sh
